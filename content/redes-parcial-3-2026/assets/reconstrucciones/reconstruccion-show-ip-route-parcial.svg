<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1780" viewBox="0 0 1600 1780" role="img" aria-labelledby="title desc">
  <title id="title">Reconstrucción parcial verificada de la topología y la tabla show ip route</title>
  <desc id="desc">Se conserva la geometría observada: tres routers en triángulo, redes de borde y equipos finales en las cuatro LAN. Las etiquetas no legibles se dejan sin transcribir. Debajo, se reproduce la tabla visible de la foto.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #142238; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .muted { fill: #52647a; }
      .small { font-size: 17px; }
      .label { font-size: 19px; font-weight: 700; }
      .network { font-size: 19px; font-weight: 700; fill: #9f2626; }
      .lan { stroke: #40596c; stroke-width: 5; fill: none; }
      .green { stroke: #27814c; stroke-width: 5; fill: none; }
      .red { stroke: #bc3038; stroke-width: 6; fill: none; }
      .router-body { fill: #dbeafe; stroke: #315b87; stroke-width: 3; }
      .switch-body { fill: #e2e8f0; stroke: #516579; stroke-width: 3; }
      .host-body { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; }
      .unknown { fill: #fff7ed; stroke: #c2410c; stroke-dasharray: 7 5; }
      .table { fill: #0d1726; }
      .table-text text { fill: #f1f5f9; font-size: 19px; }
      .chip { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
    </style>
    <g id="router">
      <circle class="router-body" cx="0" cy="0" r="43"/>
      <path d="M-22 -7h37l-8-9m8 9-8 9M22 8h-37l8-9m-8 9 8 9" fill="none" stroke="#315b87" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="switch">
      <rect class="switch-body" x="-56" y="-27" width="112" height="54" rx="9"/>
      <path d="M-35 -7h70M-35 7h70" stroke="#64748b" stroke-width="3"/>
      <circle cx="-32" cy="-7" r="2.5" fill="#1e293b"/><circle cx="-16" cy="-7" r="2.5" fill="#1e293b"/><circle cx="0" cy="-7" r="2.5" fill="#1e293b"/><circle cx="16" cy="-7" r="2.5" fill="#1e293b"/><circle cx="32" cy="-7" r="2.5" fill="#1e293b"/>
    </g>
    <g id="desktop">
      <rect class="host-body" x="-30" y="-26" width="60" height="42" rx="4"/>
      <path d="M-12 26h24M0 16v10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="tower">
      <rect class="host-body" x="-20" y="-34" width="40" height="68" rx="4"/>
      <circle cx="0" cy="20" r="3" fill="#64748b"/>
      <path d="M-10 -20h20M-10 -10h20" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <g id="laptop">
      <path class="host-body" d="M-27-20h54v34h-54zM-36 20h72l-7 7h-58z"/>
    </g>
    <g id="ap">
      <rect class="switch-body" x="-40" y="-23" width="80" height="46" rx="10"/>
      <path d="M-12 -28q12-16 24 0M-21 -34q21-27 42 0" fill="none" stroke="#516579" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="1780" fill="#f4f7fb"/>
  <text x="70" y="66" font-size="36" font-weight="700">SHOW IP ROUTE · RECONSTRUCCIÓN PARCIAL</text>
  <rect x="1260" y="28" width="270" height="48" rx="24" class="chip"/>
  <text x="1395" y="59" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">PARCIAL VERIFICADA</text>
  <text x="70" y="105" class="small muted">Foto #12 y recorte #21. La disposición y las subredes legibles se conservan; los rótulos dudosos no se completan.</text>

  <rect x="60" y="135" width="1480" height="700" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="178" font-size="25" font-weight="700">Topología · posiciones relativas y enlaces observados</text>

  <!-- LAN izquierda: dos equipos a la izquierda y uno sobre el switch. -->
  <path class="lan" d="M195 355L370 430M185 565L370 465M390 298V418M426 430H567"/>
  <g transform="translate(165 340)"><use href="#desktop"/></g>
  <g transform="translate(165 580)"><use href="#tower"/></g>
  <g transform="translate(390 270)"><use href="#desktop"/></g>
  <g transform="translate(370 445)"><use href="#switch"/></g>
  <text x="260" y="230" text-anchor="middle" class="network">192.168.10.0/24</text>
  <text x="370" y="505" text-anchor="middle" class="small muted">tipo/nombre de switch no legible</text>
  <text x="164" y="625" text-anchor="middle" class="small muted">rótulos de equipos no legibles</text>
  <text x="390" y="318" text-anchor="middle" class="small muted">rótulo no legible</text>

  <!-- Triángulo de routers; se conserva el color rojo visible sin afirmar el sentido de las flechas. -->
  <path class="red" d="M654 430H946"/>
  <path class="red" d="M632 476L778 590"/>
  <path class="red" d="M968 476L822 590"/>
  <g transform="translate(610 445)"><use href="#router"/></g>
  <g transform="translate(990 445)"><use href="#router"/></g>
  <g transform="translate(800 625)"><use href="#router"/></g>
  <text x="800" y="410" text-anchor="middle" class="network">192.168.30.0/24</text>
  <rect x="602" y="532" width="198" height="32" rx="7" fill="#fff"/>
  <text x="701" y="554" text-anchor="middle" class="network">192.168.20.0/24</text>
  <rect x="800" y="532" width="198" height="32" rx="7" fill="#fff"/>
  <text x="899" y="554" text-anchor="middle" class="network">192.168.70.0/24</text>
  <text x="610" y="505" text-anchor="middle" class="small muted">rótulo del router no legible</text>
  <text x="990" y="505" text-anchor="middle" class="small muted">rótulo del router no legible</text>
  <rect x="690" y="675" width="220" height="58" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="800" y="697" text-anchor="middle" class="label">Router2*</text>
  <text x="800" y="720" text-anchor="middle" font-size="13" class="muted">*referencia cruzada con la pregunta</text>

  <!-- LAN superior derecha: switch y dos equipos finales. -->
  <path class="lan" d="M1033 445L1146 410M1258 395L1308 282M1258 420L1370 430"/>
  <g transform="translate(1202 408)"><use href="#switch"/></g>
  <g transform="translate(1325 258)"><use href="#desktop"/></g>
  <g transform="translate(1402 440)"><use href="#desktop"/></g>
  <text x="1370" y="220" text-anchor="middle" class="network">192.168.50.0/24</text>
  <text x="1400" y="485" text-anchor="middle" class="small muted">rótulos de equipos no legibles</text>

  <!-- LAN inferior izquierda: un equipo, switch y Router2. -->
  <path class="green" d="M770 650L446 760M334 760H210"/>
  <g transform="translate(180 760)"><use href="#desktop"/></g>
  <g transform="translate(390 760)"><use href="#switch"/></g>
  <text x="280" y="710" text-anchor="middle" class="network">192.168.60.0/24</text>
  <text x="390" y="810" text-anchor="middle" class="small muted">rótulo no legible</text>

  <!-- LAN inferior derecha: punto de acceso y dos portátiles enlazados inalámbricamente. -->
  <path class="green" d="M830 650L1142 760"/>
  <path d="M1248 748Q1328 695 1380 665M1248 770Q1328 790 1380 790" fill="none" stroke="#516579" stroke-width="4" stroke-dasharray="8 8"/>
  <g transform="translate(1182 760)"><use href="#ap"/></g>
  <g transform="translate(1410 660)"><use href="#laptop"/></g>
  <g transform="translate(1410 790)"><use href="#laptop"/></g>
  <text x="1370" y="710" text-anchor="middle" class="network">192.168.40.0/24</text>
  <text x="1182" y="812" text-anchor="middle" class="small muted">Access Point</text>
  <text x="1410" y="827" text-anchor="middle" class="small muted">rótulos no legibles</text>

  <rect x="60" y="855" width="1480" height="820" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="900" font-size="25" font-weight="700">Tabla de enrutamiento transcrita de la fotografía</text>
  <text x="90" y="938" class="mono small muted">Gateway of last resort is not set</text>
  <rect x="85" y="960" width="1430" height="668" rx="10" class="table"/>
  <g class="mono table-text">
    <text x="110" y="1004">R  192.168.10.0/24 [120/1] via 192.168.20.1, 00:00:20, Serial0/1/0</text>
    <text x="110" y="1040">   192.168.20.0/24 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="110" y="1076">C     192.168.20.0/24 is directly connected, Serial0/1/0</text>
    <text x="110" y="1112">L     192.168.20.2/32 is directly connected, Serial0/1/0</text>
    <text x="110" y="1148">R  192.168.30.0/24 [120/1] via 192.168.70.2, 00:00:11, Serial0/1/1</text>
    <text x="110" y="1184">                     [120/1] via 192.168.20.1, 00:00:20, Serial0/1/0</text>
    <text x="110" y="1220">   192.168.40.0/24 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="110" y="1256">C     192.168.40.0/24 is directly connected, GigabitEthernet0/0/0</text>
    <text x="110" y="1292">L     192.168.40.1/32 is directly connected, GigabitEthernet0/0/0</text>
    <text x="110" y="1328">R  192.168.50.0/24 [120/1] via 192.168.70.2, 00:00:11, Serial0/1/1</text>
    <text x="110" y="1364">   192.168.60.0/24 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="110" y="1400">C     192.168.60.0/24 is directly connected, GigabitEthernet0/0/1</text>
    <text x="110" y="1436">L     192.168.60.1/32 is directly connected, GigabitEthernet0/0/1</text>
    <text x="110" y="1472">   192.168.70.0/24 is variably subnetted, 2 subnets, 2 masks</text>
    <text x="110" y="1508">C     192.168.70.0/24 is directly connected, Serial0/1/1</text>
    <text x="110" y="1544">L     192.168.70.1/32 is directly connected, Serial0/1/1</text>
  </g>
  <text x="90" y="1650" class="small muted">Consola transcrita. Rótulos de Router0/Router1 e interfaces del dibujo, y sentido de marcas rojas, no verificables.</text>
</svg>
