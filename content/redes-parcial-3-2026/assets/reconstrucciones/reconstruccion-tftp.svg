<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Reconstrucción visual de la pregunta TFTP</title>
  <desc id="desc">Consigna y cinco alternativas. Se conserva el selector marcado en la opción d que aparece en la fotografía.</desc>
  <rect width="1000" height="520" rx="16" fill="#e2eee9"/>
  <text x="38" y="58" font-family="Arial, sans-serif" font-size="30" fill="#1f2937">¿A qué tipo de directorios suele limitarse el acceso mediante TFTP?</text>
  <g font-family="Arial, sans-serif" font-size="30" fill="#20252d">
    <circle cx="54" cy="126" r="13" fill="#f8fafc" stroke="#79838e" stroke-width="3"/>
    <text x="90" y="136">a.</text><text x="148" y="136">Privados.</text>
    <circle cx="54" cy="188" r="13" fill="#f8fafc" stroke="#79838e" stroke-width="3"/>
    <text x="90" y="198">b.</text><text x="148" y="198">Públicos.</text>
    <circle cx="54" cy="250" r="13" fill="#f8fafc" stroke="#79838e" stroke-width="3"/>
    <text x="90" y="260">c.</text><text x="148" y="260">Públicos y privados.</text>
    <circle cx="54" cy="312" r="14" fill="#1d4ed8" stroke="#1742b5" stroke-width="3"/>
    <circle cx="54" cy="312" r="6" fill="#ffffff"/>
    <text x="90" y="322">d.</text><text x="148" y="322">Sólo para el personal de la empresa.</text>
    <circle cx="54" cy="374" r="13" fill="#f8fafc" stroke="#79838e" stroke-width="3"/>
    <text x="90" y="384">e.</text><text x="148" y="384">Ninguna de las opciones.</text>
  </g>
  <text x="40" y="452" font-family="Arial, sans-serif" font-size="24" fill="#2563eb">Quitar mi elección</text>
</svg>