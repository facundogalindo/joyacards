    <rect x="1263" y="580" width="15" height="15"/><rect x="1269" y="586" width="15" height="15"/>
  </g>
  <g fill="none" stroke="#26323d" stroke-width="3">
    <path d="M1309 244h22l-2 25h-18zM1306 239h28M1315 235h10"/>
    <path d="M1309 344h22l-2 25h-18zM1306 339h28M1315 335h10"/>
    <path d="M1309 444h22l-2 25h-18zM1306 439h28M1315 435h10"/>
    <path d="M1309 512h22l-2 25h-18zM1306 507h28M1315 503h10"/>
    <path d="M1309 580h22l-2 25h-18zM1306 575h28M1315 571h10"/>
  </g>
  <g fill="none" stroke="#23834c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1383 244l15 16 15-16"/>
    <path d="M1383 354l15-12 15 12M1423 354l15 12 15-12"/>
    <path d="M1383 454l15-12 15 12M1423 454l15 12 15-12"/>
    <path d="M1383 522l15-12 15 12M1423 522l15 12 15-12"/>
    <path d="M1383 596l15-16 15 16"/>
  </g>
  <rect x="50" y="650" width="460" height="60" fill="#167348"/>
  <rect x="510" y="650" width="1040" height="60" fill="#7b1835"/>
  <rect x="50" y="710" width="1500" height="48" fill="#167348"/>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
    <text x="244" y="689">Green &gt;</text>
    <text x="925" y="689">Internet (Permitido)</text>
    <text x="695" y="741">Política: Permitido</text>
  </g>
  <text x="40" y="815" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20252d">¿Qué sucederá?</text>
  <g font-family="Arial, sans-serif" font-size="23" fill="#20252d">
    <circle cx="53" cy="864" r="8" fill="#fff" stroke="#66717d" stroke-width="2"/><text x="80" y="872">a. La conexión será exitosa por la política implementada en el firewall.</text>
    <circle cx="53" cy="930" r="8" fill="#fff" stroke="#66717d" stroke-width="2"/><text x="80" y="923">b. La conexión será exitosa ya que hay una regla que permite el paso del protocolo ICMP de toda</text><text x="111" y="953">la red VERDE a la IP destino.</text>
    <circle cx="53" cy="1000" r="8" fill="#fff" stroke="#66717d" stroke-width="2"/><text x="80" y="1008">c. La conexión será bloqueada debido a la regla 5.</text>
    <circle cx="53" cy="1060" r="8" fill="#fff" stroke="#66717d" stroke-width="2"/><text x="80" y="1068">d. La conexión será bloqueada por la política implementada en el firewall.</text>
    <circle cx="53" cy="1120" r="8" fill="#fff" stroke="#66717d" stroke-width="2"/><text x="80" y="1128">e. La conexión será exitosa debido a la regla 5.</text>
  </g>
</svg>